<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2322a06b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fafaf8; --card: #ffffff; --text: #1c1c1a; --muted: #74746e; --faint: #a6a69f; --line: #e7e7e2;
  --hover: #f1f1ed; --chip: #f2f2ee; --done: #3a3a37;
  --accent: #3b5bdb; --accent-soft: rgba(59, 91, 219, .10); --violet: #7048e8; --bad: #d64545;
  --live: #1f9d63; --live-soft: rgba(31, 157, 99, .16);
  --review: #9a5b00; --review-mark: #c27803; --review-soft: #f8edd8;
  --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 6px 24px rgba(20, 20, 15, .06);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #2c2c2a;
    --hover: #222220; --chip: #232321; --done: #d8d8d2; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .14); --violet: #b197fc; --bad: #f07575;
    --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .18); --review: #e7b555; --review-mark: #e7b555; --review-soft: rgba(231, 181, 85, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #2c2c2a;
  --hover: #222220; --chip: #232321; --done: #d8d8d2; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .14); --violet: #b197fc; --bad: #f07575;
  --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .18); --review: #e7b555; --review-mark: #e7b555; --review-soft: rgba(231, 181, 85, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
main { max-width: 720px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) 24px 72px; }
button, a { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg { width: 16px; height: 16px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes popRow { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes ring { 0% { transform: scale(.5); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 14px; color: var(--muted); }
.bar .end { margin-left: auto; display: flex; gap: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px 5px 6px; margin-left: -6px; border-radius: 8px; }
.back:hover { background: var(--chip); color: var(--text); }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.iconbtn:hover { background: var(--chip); color: var(--text); }

h1 { margin: 22px 0 6px; font-size: 34px; line-height: 1.15; font-weight: 680; letter-spacing: -0.025em; }



/* ---------- filter ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 30px 0 4px; }
.chip { padding: 4px 11px; border-radius: 999px; font-size: 13.5px; color: var(--muted); background: var(--chip); }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }

.sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.session { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 0 6px; animation: rise .5s both; }
.shead { padding: 14px 18px 10px; }
.sname { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 650; letter-spacing: -0.015em; }
.sname .live { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--live); }
.sname .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.smeta { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.plink { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.more { margin: 2px 0 6px 38px; font-size: 13.5px; color: var(--muted); padding: 4px 0; }
.more:hover { color: var(--text); }

@keyframes popDiamond { 0% { opacity: 0; transform: rotate(45deg) scale(.3); } 100% { opacity: 1; transform: rotate(45deg) scale(1); } }

.empty-state { margin-top: 60px; color: var(--muted); }
.empty-state b { color: var(--text); display: block; font-size: 18px; margin-bottom: 4px; }

/* ---------- one task ---------- */
.kicker { margin-top: 26px; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.kicker .sep { color: var(--faint); }

.player { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 14px; margin: 26px -12px 0; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; }
.play { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 12px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600; flex: none; }
.play svg { width: 12px; height: 12px; }
.scrub { flex: 1; position: relative; height: 28px; display: flex; align-items: center; }
.scrub input { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; position: relative; z-index: 1; cursor: pointer; }
.scrub input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: transparent; }
.scrub input::-moz-range-track { height: 4px; background: transparent; }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 2px var(--text), 0 2px 6px rgba(0, 0, 0, .2); }
.scrub input::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 2px var(--text); }
.scrub .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--line); overflow: hidden; }
.scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 2px; }
.scrub .marks { position: absolute; left: 0; right: 0; top: 50%; pointer-events: none; }
.scrub .tick { position: absolute; top: -12px; width: 6px; height: 6px; margin-left: -3px; border-radius: 2px; transform: rotate(45deg); background: var(--muted); }
.scrub .tick.low { background: var(--review-mark); } .scrub .tick.you { background: var(--accent); border-radius: 50%; }
.clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }

/* the map, replayed */
.map { list-style: none; margin: 18px 0 0; padding: 0; position: relative; }
.map::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: var(--line); border-radius: 1px; }
.map .rail { position: absolute; left: 11px; top: 14px; width: 2px; background: var(--done); border-radius: 1px; transition: height .4s cubic-bezier(.2, .8, .2, 1); }
.step { position: relative; padding: 9px 0 9px 40px; }
.step .dot { position: absolute; left: 3px; top: 12px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--done); color: var(--bg); transition: background .3s, box-shadow .3s, transform .3s; }
.step .dot svg { width: 11px; height: 11px; transition: opacity .2s; }
.step .head { display: flex; align-items: baseline; gap: 10px; }
.step .text { flex: 1; min-width: 0; font-size: 16.5px; color: var(--muted); transition: color .3s; }
.step .took { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mark { font-size: 12px; color: var(--accent); margin-left: 8px; white-space: nowrap; }
.step.drop .dot { background: var(--bg); box-shadow: inset 0 0 0 2px var(--faint); }
.step.drop .text { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line); }
.step.drop .took { font-style: normal; }
/* during the replay */
.step.ahead .dot { background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
.step.ahead .dot svg { opacity: 0; }
.step.ahead .text { color: var(--faint); }
.step.ahead .took { opacity: 0; }
.step.now .dot { background: var(--live); box-shadow: 0 0 0 5px var(--live-soft); transform: scale(1.1); }
.step.now .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--live); animation: ring 1.4s ease-out infinite; }
.step.now .dot svg { opacity: 0; }
.step.now .text { color: var(--text); font-weight: 600; }
.step.justdone .dot { animation: pop .4s both; }

.att { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; gap: 8px; }
.ev.hidden { display: none; }
.ev.fresh { animation: popRow .45s cubic-bezier(.2, .8, .2, 1) both; }
.dec { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 11px 14px 12px; display: grid; grid-template-columns: 16px 1fr; column-gap: 10px; }
.meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; margin-top: 5px; }
.meter i { width: 3px; border-radius: 2px; background: var(--line); }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 9px; } .meter i:nth-child(3) { height: 13px; }
.meter.c3 i, .meter.c2 i:nth-child(-n+2) { background: var(--muted); }
.meter.c1 i:nth-child(1) { background: var(--review-mark); }
.dec .what { font-weight: 560; }
.dec .why { color: var(--muted); font-size: 14.5px; }
.dec .old { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); font-weight: 500; }
.dec .said { margin-top: 6px; font-size: 14.5px; color: var(--accent); display: flex; gap: 6px; }
.dec .said q { color: var(--text); quotes: "“" "”"; }
.dec .then { margin-top: 6px; }
.dec .tag { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--review); background: var(--review-soft); padding: 0 6px; border-radius: 5px; vertical-align: 1px; }
.dec .tag.you { color: var(--accent); background: var(--accent-soft); }
.nudge { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; color: var(--muted); padding-left: 2px; }
.nudge .ic { color: var(--accent); flex: none; transform: translateY(2px); }
.nudge .ic svg { width: 13px; height: 13px; }
.nudge b { color: var(--text); font-weight: 500; }
.nudge .st { margin-left: auto; font-size: 13px; color: var(--faint); white-space: nowrap; }

.foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--faint); }

@media (max-width: 560px) {
  main { padding: max(28px, env(safe-area-inset-top)) 16px 56px; }
  h1 { font-size: 28px; }
  .shead { padding: 13px 15px 8px; }
  .tasks { margin: 0 4px; }
  .player { gap: 10px; }
  .play span { display: none; }
  .play { padding: 9px; }
  .clock { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- the list ---------- */
h2 { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.calm { display: flex; align-items: center; gap: 8px; margin: 26px 0 0; color: var(--muted); font-size: 15px; }
.calm svg { color: var(--live); width: 14px; height: 14px; }
.needs { margin-top: 26px; }
.needs ul { list-style: none; margin: 10px 0 0; padding: 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.need { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.need:first-child { border-top: 0; }
.need .nd { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--review-mark); }
.need.bad .nd { background: var(--bad); } .need.info .nd { background: var(--accent); }
.need .nt { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: baseline; }
.need .nt b { font-weight: 560; }
.need .nt span { color: var(--faint); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.need .nt:hover span { color: var(--muted); }
.fine { font-size: 13.5px; color: var(--muted); padding: 4px 10px; border-radius: 8px; background: var(--chip); }
.fine:hover { color: var(--text); }
.since { margin-top: 34px; }
.older { margin-top: 22px; font-size: 14px; color: var(--muted); padding: 6px 0; }
.older:hover { color: var(--text); }
.sessions { margin-top: 12px; }
.calm + .sessions, .needs + .sessions { margin-top: 26px; }
.tasks { list-style: none; margin: 0 6px 2px; padding: 0; }
.task { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; transition: background .15s; }
.task:hover { background: var(--hover); }
.task .title { flex: 1; min-width: 0; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .title.plain { color: var(--muted); }
.task .when { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 40px; text-align: right; }
.verb { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; color: var(--vc); background: color-mix(in srgb, var(--vc) 13%, transparent); }
.v-fixed { --vc: var(--violet); } .v-added { --vc: var(--live); } .v-changed { --vc: var(--accent); } .v-removed { --vc: var(--muted); }
.proofs { display: inline-flex; gap: 4px; flex: none; }
.proof { display: inline-flex; align-items: center; gap: 4px; color: var(--faint); font-size: 12.5px; }
.proof svg { width: 13px; height: 13px; }
.proof.ok svg { color: var(--live); } .proof.bad, .proof.bad svg { color: var(--bad); } .proof.warn svg { color: var(--review-mark); }
.task .proof.ok .pl, .task .proof:not(.bad):not(.warn) .pl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.task .proof.ok, .task .proof:not(.bad):not(.warn) { width: 18px; justify-content: center; }
.task .proof.warn { color: var(--review); }
.task .proofs { gap: 8px; }

/* ---------- one task: the brief ---------- */
.thead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.thead .verb { font-size: 14px; padding: 3px 10px; border-radius: 8px; }
.brief { margin-top: 18px; }
.ba { display: grid; grid-template-columns: 70px 1fr; gap: 8px 14px; margin: 0; font-size: 18px; align-items: baseline; }
.ba dt { font-size: 13px; color: var(--faint); }
.ba dd { margin: 0; }
.ba .c { color: var(--review); }
.proofs.big { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.proofs.big .proof { font-size: 13.5px; color: var(--muted); background: var(--chip); padding: 4px 10px 4px 8px; border-radius: 999px; }
.proofs.big .proof.bad { color: var(--bad); } .proofs.big .proof.warn { color: var(--review); }
.resline { margin: 0; font-size: 18px; }
.outs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
.obtn { padding: 7px 14px; border-radius: 99px; font-size: 14px; font-weight: 550; background: var(--chip); }
.obtn.main { background: var(--text); color: var(--bg); }
.olink { font-size: 14px; color: var(--muted); padding: 7px 4px; }
.olink:hover { color: var(--text); }
.mgroup { margin-top: 24px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.thumb { width: 150px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.thumb img { width: 150px; height: 96px; object-fit: cover; object-position: top; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); background: var(--chip); transition: box-shadow .15s; }
.thumb:hover img, .thumb:hover .docicon { box-shadow: 0 0 0 2px var(--accent); }
.thumb .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: flex; flex-direction: column; }
.thumb .cap b { font-weight: 560; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docicon { width: 150px; height: 96px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; color: var(--muted); box-shadow: 0 0 0 1px var(--line); }
.docicon svg { width: 26px; height: 26px; }
.decs { margin-top: 26px; }
.decs ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.decs li { display: flex; align-items: baseline; gap: 10px; font-size: 15.5px; }
.decs .dd { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg) translateY(-1px); background: var(--muted); flex: none; }
.decs li.low .dd { background: var(--review-mark); } .decs li.you .dd { background: var(--accent); }
.decs .tag { font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.replay-h { margin-top: 38px; }
</style>
</head>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('t') || '';
  const FROM = params.get('from') || '';
  try { const t = localStorage.getItem('status-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  const app = document.getElementById('app');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid.nodeType ? kid : String(kid));
    return el;
  };
  const svg = (d, width = 1.8) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', String(width)); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true'); s.innerHTML = d; return s;
  };
  const ICON = {
    back: () => svg('<path d="M10 4L6 8l4 4"/>', 2),
    sun: () => svg('<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>', 1.6),
    moon: () => svg('<path d="M13.2 9.6A5.5 5.5 0 0 1 6.4 2.8a5.5 5.5 0 1 0 6.8 6.8z"/>', 1.6),
    check: () => svg('<path d="M3.5 8.5l3 3 6-7"/>', 2.8),
    play: () => svg('<path d="M5 3.2l8 4.8-8 4.8z" fill="currentColor"/>', 1.2),
    pause: () => svg('<path d="M5.5 3.5v9M10.5 3.5v9"/>', 2.8),
    again: () => svg('<path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/>', 2),
    you: () => svg('<path d="M3 13.5c.6-2.4 2.6-3.8 5-3.8s4.4 1.4 5 3.8"/><circle cx="8" cy="5.2" r="2.6"/>', 1.8),
    side: () => svg('<path d="M5 11l6-6M6 5h5v5"/>', 2.2),
    x: () => svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>', 2.2),
    eye: () => svg('<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8 11.9 12.3 8 12.3 1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.8"/>', 1.6),
    dash: () => svg('<path d="M4.5 8h7"/>', 2.2),
    up: () => svg('<path d="M8 12.5v-9M4.5 7L8 3.5 11.5 7"/>', 2),
    doc: () => svg('<path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5.2h3.4M6 8.5h4.5M6 11h4.5"/>', 1.4),
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const dur = ms => {
    const s = Math.max(1, Math.round(ms / 1000));
    if (s < 60) return `${s}s`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m`;
    const hr = Math.floor(m / 60), r = m % 60;
    if (hr < 24) return r ? `${hr}h ${r}m` : `${hr}h`;
    return plural(Math.round(hr / 24), 'day');
  };
  const clockTime = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const DAY = 86400000;
  const dayLabel = t => {
    const diff = Math.round((dayStart(Date.now()) - dayStart(t)) / DAY);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return new Date(t).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  };
  const rootOf = (all, d) => { let r = d; for (let i = 0; i < 20 && r.supersedes; i++) { const p = all.find(x => x.id === r.supersedes); if (!p) break; r = p; } return r; };

  // ---------- theme ----------
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  function themeButton() {
    const dark = isDark();
    return h('button', { class: 'iconbtn', 'aria-label': dark ? 'Switch to light mode' : 'Switch to dark mode', title: dark ? 'Light mode' : 'Dark mode',
      onclick: e => {
        const t = dark ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem('status-theme', t); } catch {}
        e.currentTarget.replaceWith(themeButton());
      } }, dark ? ICON.sun() : ICON.moon());
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { const b = app.querySelector('.bar .end .iconbtn'); b && b.replaceWith(themeButton()); });

  // ---------- data ----------
  let tasks = null, failed = false;
  let project = '';

  async function load() {
    try {
      const r = await fetch('/api/history', { headers: { 'x-token': TOKEN } });
      if (!r.ok) throw new Error(r.status);
      tasks = (await r.json()).tasks;
      try { localStorage.setItem('history-seen', String(Date.now())); } catch {}
    } catch { failed = true; }
    route();
  }
  window.addEventListener('hashchange', () => { stop(); route(); scrollTo(0, 0); });
  function route() {
    const key = decodeURIComponent(location.hash.slice(1));
    const t = tasks && key && tasks.find(x => x.key === key);
    app.replaceChildren(...(t ? detail(t) : list()).filter(Boolean));
    document.title = t ? `${t.title} · History` : 'History';
  }

  function topBar(backTo) {
    const back = backTo === 'list'
      ? h('a', { class: 'back', href: '#' }, ICON.back(), 'History')
      : FROM ? h('a', { class: 'back', href: `/?t=${encodeURIComponent(TOKEN)}#${encodeURIComponent(FROM)}` }, ICON.back(), 'Live page') : null;
    return h('div', { class: 'bar' }, back, h('span', { class: 'end' }, themeButton()));
  }

  // ---------- the list ----------
  // When you last opened History (kept in this browser only), so the page can lead with what's new.
  let lastSeen = 0;
  try { lastSeen = Number(localStorage.getItem('history-seen')) || 0; } catch {}
  let showOlder = false;

  const VERB_CLASS = { Fixed: 'v-fixed', Added: 'v-added', Changed: 'v-changed', Removed: 'v-removed' };
  const verbTag = t => t.summary ? h('span', { class: 'verb ' + (VERB_CLASS[t.summary.verb] || '') }, t.summary.verb) : null;
  const headline = t => t.summary ? t.summary.headline.replace(/^./, c => c.toUpperCase()) : t.title;

  // What the page saw happen. Never written by Claude.
  function proofChips(t, full) {
    const p = t.proof;
    if (!p) return [];
    const chips = [];
    if (p.tests === 'passed') chips.push(['ok', ICON.check(), 'Tests pass']);
    if (p.tests === 'failed') chips.push(['bad', ICON.x(), 'Tests fail']);
    if (p.looked) chips.push(['ok', ICON.eye(), full ? 'Checked in browser' : 'Checked']);
    if (!p.tests && !p.looked) chips.push(['warn', ICON.dash(), 'Not checked']);
    if (p.pushed) chips.push(['', ICON.up(), 'Pushed']);
    else if (p.committed) chips.push(['warn', ICON.up(), 'Not pushed']);
    return chips.map(([cls, icon, label]) => h('span', { class: 'proof ' + cls, title: label }, icon, h('span', { class: 'pl' }, label)));
  }

  // Things only you can settle: a catch you haven't accepted, failing tests, work that never left your machine.
  function needsYou(shown) {
    const items = [];
    const unpushed = new Set();
    for (const t of shown) {
      const ack = t.ack || [];
      if (t.summary && t.summary.catch && !ack.includes('catch')) items.push({ t, what: 'catch', tone: 'warn', text: t.summary.catch });
      if (t.proof && t.proof.tests === 'failed' && !ack.includes('tests')) items.push({ t, what: 'tests', tone: 'bad', text: 'Tests failed' });
      // One line per session: the newest commit that was never pushed.
      if (t.proof && t.proof.committed && !t.proof.pushed && !ack.includes('push') && !unpushed.has(t.session)) {
        unpushed.add(t.session); items.push({ t, what: 'push', tone: 'info', text: 'Not pushed yet' });
      }
    }
    return items;
  }

  function ack(item) {
    item.t.ack = [...(item.t.ack || []), item.what];
    fetch('/api/user/ack', { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN }, body: JSON.stringify({ session: item.t.session, key: item.t.key, what: item.what }) }).catch(() => {});
    route();
  }

  function needsSection(items) {
    if (!items.length) return h('p', { class: 'calm' }, ICON.check(), 'Nothing needs you.');
    return h('section', { class: 'needs', 'aria-label': 'Needs you' },
      h('h2', {}, 'Needs you'),
      h('ul', {}, items.map(it => h('li', { class: 'need ' + it.tone },
        h('span', { class: 'nd' }),
        h('a', { class: 'nt', href: '#' + encodeURIComponent(it.t.key) }, h('b', {}, it.text), h('span', {}, headline(it.t))),
        h('button', { class: 'fine', onclick: () => ack(it), title: 'Stop listing this here' }, 'Fine')))));
  }

  function list() {
    if (failed) return [topBar(), h('h1', {}, 'History'), h('div', { class: 'empty-state' }, h('b', {}, 'Couldn’t load the history.'), 'Open the link Claude gave you, then try again.')];
    if (!tasks) return [topBar(), h('h1', {}, 'History')];
    if (!tasks.length) return [topBar(), h('h1', {}, 'History'),
      h('div', { class: 'empty-state' }, h('b', {}, 'Nothing here yet.'), 'Finished tasks land here.')];

    const projects = [...new Set(tasks.map(t => t.project).filter(Boolean))];
    const shown = tasks.filter(t => !project || t.project === project);
    const chips = projects.length > 1 && h('div', { class: 'chips', role: 'group', 'aria-label': 'Project' },
      ['', ...projects].map(p => h('button', { class: 'chip', 'aria-pressed': String(project === p), onclick: () => { project = p; route(); } }, p || 'All projects')));

    const fresh = lastSeen ? shown.filter(t => t.endedAt > lastSeen) : shown;
    const older = lastSeen ? shown.filter(t => t.endedAt <= lastSeen) : [];
    let n = 0;
    const sessionsOf = items => {
      const by = new Map();
      for (const t of items) { if (!by.has(t.session)) by.set(t.session, []); by.get(t.session).push(t); }
      return h('ul', { class: 'sessions' }, [...by.values()].map(group => h('li', {}, sessionCard(group, n++))));
    };

    const body = [];
    if (lastSeen) {
      body.push(h('h2', { class: 'since' }, fresh.length ? `New since you last looked` : `Nothing new since ${dayLabel(lastSeen).toLowerCase() === 'today' ? clockTime(lastSeen) : dayLabel(lastSeen)}`));
      if (fresh.length) body.push(sessionsOf(fresh));
      if (older.length) {
        body.push(h('button', { class: 'older', 'aria-expanded': String(showOlder), onclick: () => { showOlder = !showOlder; route(); } },
          showOlder ? 'Hide earlier tasks' : `Earlier · ${plural(older.length, 'task')}`));
        if (showOlder) body.push(sessionsOf(older));
      }
    } else body.push(sessionsOf(fresh));

    return [topBar(), h('h1', {}, 'History'), chips, needsSection(needsYou(shown)), ...body,
      h('p', { class: 'foot' }, 'Read-only. Tasks are kept for 30 days.')];
  }

  // One session: named after the task it started with, its tasks newest first.
  const SHOW = 4;
  const openSessions = new Set();
  const sessionName = id => { const own = tasks.filter(t => t.session === id); return own.length ? own[own.length - 1].title : ''; };
  function sessionCard(items, i) {
    const all = tasks.filter(t => t.session === items[0].session);
    const first = all[all.length - 1], last = all[0];
    const start = Math.min(...all.map(t => t.startedAt));
    const when = dayStart(start) === dayStart(last.endedAt) ? `${dayLabel(start)}, ${clockTime(start)} – ${clockTime(last.endedAt)}` : `${dayLabel(start)} – ${dayLabel(last.endedAt)}`;
    const parentName = first.parent && sessionName(first.parent);
    const open = openSessions.has(first.session);
    const visible = open ? items : items.slice(0, SHOW);
    return h('article', { class: 'session', id: 's-' + first.session, style: `animation-delay:${Math.min(i, 10) * 50}ms` },
      h('header', { class: 'shead' },
        h('div', { class: 'sname' }, first.title, first.sessionLive ? h('span', { class: 'live', title: 'This session is still open' }, 'Open') : null),
        h('div', { class: 'smeta' }, [first.project, when, parentName && `side session of ${parentName}`].filter(Boolean).join(' · '))),
      h('ol', { class: 'tasks' }, visible.map(t => h('li', {}, taskRow(t)))),
      items.length > SHOW ? h('button', { class: 'more', onclick: () => { open ? openSessions.delete(first.session) : openSessions.add(first.session); route(); } },
        open ? 'Show fewer' : `Show ${items.length - SHOW} more`) : null);
  }

  // One line: verb, headline, proof, time.
  function taskRow(t) {
    return h('a', { class: 'task', href: '#' + encodeURIComponent(t.key) },
      verbTag(t),
      h('span', { class: 'title' + (t.summary ? '' : ' plain') }, headline(t)),
      h('span', { class: 'proofs' }, proofChips(t, false)),
      h('span', { class: 'when' }, clockTime(t.endedAt)));
  }

  // Everything that happened in a task, in time order.
  function timeline(t) {
    const ev = [];
    t.done.forEach(d => ev.push({ t: d.at, kind: 'step', d }));
    t.decisions.forEach(d => { ev.push({ t: d.at, kind: 'dec', d }); if (d.override) ev.push({ t: d.override.at || d.at + 1, kind: 'you', d }); });
    t.followups.forEach(f => { ev.push({ t: f.at, kind: 'fu', f }); if (f.doneAt) ev.push({ t: f.doneAt, kind: 'fudone', f }); });
    (t.children || []).forEach(c => ev.push({ t: c.at, kind: 'side', c }));
    return ev.filter(e => Number.isFinite(e.t)).sort((a, b) => a.t - b.t);
  }

  // ---------- one task, replayable ----------
  let player = null;
  function stop() { if (player) { clearTimeout(player.timer); player = null; } }

  function detail(t) {
    const all = t.decisions;
    const doneIds = new Set(t.done.map(d => d.id));
    // Attach each item to its step; if its step is gone, to the first step finished after it.
    const stepFor = (id, at) => doneIds.has(id) ? id : (t.done.find(d => d.at >= at) || t.done[t.done.length - 1] || {}).id;
    const under = new Map();
    const put = (id, item) => { if (!under.has(id)) under.set(id, []); under.get(id).push(item); };
    all.filter(d => !d.supersedes).forEach(d => put(stepFor(d.stepId, d.at), { at: d.at, el: decisionCard(d, all) }));
    t.followups.forEach(x => put(stepFor(x.stepId, x.at), { at: x.at, el: h('li', { class: 'nudge ev', 'data-t': x.at }, h('span', { class: 'ic' }, ICON.you()), h('span', {}, 'You asked: ', h('b', {}, x.text)), h('span', { class: 'st' }, x.state === 'done' ? 'Done' : 'Not done')) }));
    (t.children || []).forEach(c => put(stepFor(c.stepId, c.at), { at: c.at, el: h('li', { class: 'nudge ev', 'data-t': c.at }, h('span', { class: 'ic' }, ICON.side()), h('span', {}, 'Side session: ', h('b', {}, c.title || 'untitled')), h('span', { class: 'st' }, c.total ? `${c.done} of ${c.total} done` : '')) }));

    const rows = t.done.map((d, i) => h('li', { class: 'step', 'data-t': d.at, 'data-i': i },
      h('span', { class: 'dot' }, ICON.check()),
      h('div', { class: 'head' }, h('span', { class: 'text' }, d.text, d.edited && h('span', { class: 'mark' }, 'your edit')), h('span', { class: 'took' }, d.took ? dur(d.took) : '')),
      (under.get(d.id) || []).length ? h('ul', { class: 'att' }, under.get(d.id).sort((a, b) => a.at - b.at).map(x => x.el)) : null));
    const drops = t.dropped.map(text => h('li', { class: 'step drop' }, h('span', { class: 'dot' }), h('div', { class: 'head' }, h('span', { class: 'text' }, text), h('span', { class: 'took' }, 'not done'))));
    const map = h('ol', { class: 'map', 'aria-label': 'Steps' }, h('span', { class: 'rail', 'aria-hidden': 'true' }), rows, drops);

    const ev = timeline(t);
    const sum = t.summary;
    // The newest wording of each decision, and whether you changed it.
    const decisions = all.filter(d => !d.supersedes).map(root => {
      let d = root;
      for (let i = 0; i < 20; i++) { const next = all.find(x => x.supersedes === d.id); if (!next) break; d = next; }
      return { text: d.text, why: d.reason, you: !!(root.override || d !== root), low: d.confidence === 'low' };
    });
    const brief = h('section', { class: 'brief' },
      // No summary from Claude: one short line from what it made or its closing words.
      !sum && ((t.outputs || []).length || t.recap) ? h('p', { class: 'resline' }, (t.outputs || []).length ? `${t.outputs[0].name} is ready` : firstSentence(t.recap)) : null,
      sum ? h('dl', { class: 'ba' },
        h('dt', {}, 'Before'), h('dd', {}, sum.before),
        h('dt', {}, 'After'), h('dd', {}, sum.after),
        sum.catch ? [h('dt', { class: 'c' }, 'Catch'), h('dd', { class: 'c' }, sum.catch)] : null) : null,
      t.proof ? h('div', { class: 'proofs big' }, proofChips(t, true)) : null,
      outputsRow(t),
      mediaStrip(t),
      decisions.length ? h('div', { class: 'decs' }, h('h2', {}, plural(decisions.length, 'decision')),
        h('ul', {}, decisions.map(d => h('li', { class: d.you ? 'you' : d.low ? 'low' : '', title: d.why || '' },
          h('span', { class: 'dd' }), d.text, d.you ? h('span', { class: 'tag' }, 'you changed this') : null)))) : null);

    const view = [
      topBar('list'),
      h('div', { class: 'kicker' }, [t.project, `${dayLabel(t.endedAt)}, ${clockTime(t.startedAt)} – ${clockTime(t.endedAt)}`, dur(t.endedAt - t.startedAt)].filter(Boolean).flatMap((x, i) => i ? [h('span', { class: 'sep' }, '·'), x] : [x])),
      h('h1', { class: 'thead' }, verbTag(t), headline(t)),
      brief,
      h('h2', { class: 'replay-h' }, `Steps · ${t.done.length} of ${t.done.length + t.dropped.length} done`),
      ev.length > 1 ? playerBar(t, ev) : null,
      map,
      h('p', { class: 'foot' }, 'Read-only. This is how the task ended.'),
    ];
    requestAnimationFrame(() => setRail(1));
    return view;
  }

  const firstSentence = x => { const m = String(x || '').match(/^.+?[.!?](\s|$)/); const y = (m ? m[0] : String(x || '')).trim(); return y.length > 100 ? y.slice(0, 99).replace(/\s+\S*$/, '') + '…' : y; };
  const openFile = (t, target, reveal) => fetch('/api/user/open', { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN },
    body: JSON.stringify({ session: t.session, key: t.key, target, reveal }) }).catch(() => {});
  const mediaUrl = m => `/media/${m.file}?t=${encodeURIComponent(TOKEN)}`;

  // What to open: the thing the task made.
  function outputsRow(t) {
    const outs = t.outputs || [];
    if (!outs.length) return null;
    return h('div', { class: 'outs' }, outs.flatMap((o, i) => o.kind === 'url'
      ? h('a', { class: 'obtn' + (i ? '' : ' main'), href: o.target, target: '_blank', rel: 'noopener noreferrer' }, `Open ${o.name}`)
      : [h('button', { class: 'obtn' + (i ? '' : ' main'), onclick: () => openFile(t, o.target, false) }, `Open ${o.name}`),
         i ? null : h('button', { class: 'olink', onclick: () => openFile(t, o.target, true) }, 'Show in folder')]));
  }

  // Your attachments and what Claude made, each labeled with where it came from.
  function mediaStrip(t) {
    const media = t.media || [];
    const you = media.filter(m => m.kind === 'you');
    const shots = media.filter(m => m.kind === 'shot');
    const outs = new Set((t.outputs || []).map(o => o.target));
    const docs = (t.docs || []).filter(d => !outs.has(d.target));
    const thumb = m => h('a', { class: 'thumb', href: mediaUrl(m), target: '_blank', rel: 'noopener' },
      h('img', { src: mediaUrl(m), alt: m.step || m.name || 'Image', loading: 'lazy' }),
      h('span', { class: 'cap' }, m.kind === 'you' ? `Your message, ${clockTime(m.at)}` : m.step || 'Screenshot'));
    const doc = d => h('button', { class: 'thumb doc', onclick: () => openFile(t, d.target, false), title: `Open ${d.name}` },
      h('span', { class: 'docicon' }, ICON.doc()), h('span', { class: 'cap' }, h('b', {}, d.name), d.step ? h('span', {}, d.step) : null));
    const group = (label, items) => items.length ? h('div', { class: 'mgroup' }, h('h2', {}, label), h('div', { class: 'thumbs' }, items)) : null;
    return [group('You gave', you.map(thumb)), group('Claude made', [...shots.map(thumb), ...docs.map(doc)])];
  }

  function decisionCard(d, all) {
    const chain = [d];
    for (let i = 0; i < 20; i++) { const n = all.find(x => x.supersedes === chain[chain.length - 1].id); if (!n) break; chain.push(n); }
    const last = chain[chain.length - 1];
    const level = { high: 3, medium: 2, low: 1 }[last.confidence] || 2;
    const body = [];
    chain.forEach((x, i) => {
      const final = i === chain.length - 1;
      if (!final) body.push(h('div', { class: 'old' }, x.text));
      else body.push(h('div', { class: 'what' + (i ? ' then' : '') }, x.text,
        x.confidence === 'low' && !x.override && h('span', { class: 'tag' }, 'was a guess'),
        i > 0 && h('span', { class: 'tag you' }, 'after your change')));
      if (x.override) body.push(h('div', { class: 'said ev', 'data-t': x.override.at || x.at + 1 }, h('span', {}, 'You:'), h('q', {}, x.override.text)));
    });
    if (last.reason) body.push(h('div', { class: 'why' }, last.reason));
    return h('li', { class: 'dec ev', 'data-t': d.at },
      h('span', { class: `meter c${level}`, role: 'img', 'aria-label': `${last.confidence} confidence` }, h('i'), h('i'), h('i')),
      h('div', {}, body));
  }

  function playerBar(t, ev) {
    const times = [...new Set(ev.map(e => e.t))];
    const n = times.length;
    const fill = h('span', { class: 'fill', style: 'width:100%' });
    // Small marks above the track where Claude decided something (amber: a guess) or you stepped in (blue).
    const ticks = times.map((tt, i) => {
      const here = ev.filter(e => e.t === tt);
      const you = here.some(e => e.kind === 'you' || e.kind === 'fu'), dec = here.find(e => e.kind === 'dec');
      if (!you && !dec) return null;
      return h('span', { class: 'tick' + (you ? ' you' : dec.d.confidence === 'low' ? ' low' : ''), style: `left:${n > 1 ? (i / (n - 1)) * 100 : 100}%` });
    });
    const input = h('input', { type: 'range', min: 0, max: n - 1, value: n - 1, step: 1, 'aria-label': 'Replay position' });
    const clock = h('span', { class: 'clock' }, dur(t.endedAt - t.startedAt));
    const btn = h('button', { class: 'play' });
    const setBtn = playing => btn.replaceChildren(...(playing ? [ICON.pause(), h('span', {}, 'Pause')] : pos >= n - 1 ? [ICON.again(), h('span', {}, 'Replay')] : [ICON.play(), h('span', {}, 'Play')]));
    const show = (k, animate) => {
      input.value = k;
      fill.style.width = `${n > 1 ? (k / (n - 1)) * 100 : 100}%`;
      clock.textContent = '+' + dur(times[k] - t.startedAt);
      apply(times[k], k === n - 1, animate);
    };
    let pos = n - 1; // -1 is the moment the task started
    const step = () => {
      if (pos >= n - 1) { player = null; setBtn(false); return; }
      pos++; show(pos, true);
      player.timer = setTimeout(step, Math.max(320, Math.min(900, 7000 / n)));
    };
    btn.addEventListener('click', () => {
      if (player) { stop(); setBtn(false); return; }
      if (pos >= n - 1) { // start over from an empty map
        pos = -1; input.value = 0; fill.style.width = '0%'; clock.textContent = '+0s';
        apply(t.startedAt - 1, false, false);
      }
      player = { timer: setTimeout(step, 450) };
      setBtn(true);
    });
    input.addEventListener('input', () => { stop(); pos = Number(input.value); show(pos, false); setBtn(false); });
    setBtn(false);
    return h('div', { class: 'player' }, btn, h('div', { class: 'scrub' }, h('span', { class: 'track' }, fill), h('span', { class: 'marks' }, ticks), input), clock);
  }

  // Show the task as it stood at time `at`.
  function apply(at, end, animate) {
    const steps = [...app.querySelectorAll('.step:not(.drop)')];
    let nowSet = false, doneN = 0;
    for (const el of steps) {
      const t = Number(el.dataset.t);
      const wasAhead = el.classList.contains('ahead') || el.classList.contains('now');
      el.classList.remove('ahead', 'now', 'justdone');
      if (t <= at) { doneN++; if (animate && wasAhead) el.classList.add('justdone'); }
      else if (!nowSet && !end) { el.classList.add('now'); nowSet = true; }
      else el.classList.add('ahead');
    }
    for (const el of app.querySelectorAll('.ev')) {
      const visible = Number(el.dataset.t) <= at || end;
      const was = !el.classList.contains('hidden');
      el.classList.toggle('hidden', !visible);
      el.classList.toggle('fresh', !!(animate && visible && !was));
    }
    setRail(end ? 1 : doneN / Math.max(1, steps.length), steps[Math.max(0, doneN - (nowSet ? 0 : 1))]);
  }
  // The dark rail grows down the map as steps finish.
  function setRail(frac, upTo) {
    const rail = app.querySelector('.rail'), map = app.querySelector('.map');
    if (!rail || !map) return;
    const steps = map.querySelectorAll('.step:not(.drop)');
    const target = frac >= 1 ? steps[steps.length - 1] : upTo;
    if (!target) { rail.style.height = '0px'; return; }
    const top = target.offsetTop + 12;
    rail.style.height = Math.max(0, top - 14) + 'px';
  }

  route();
  load();
})();
</script>
</body>
</html>
