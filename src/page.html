<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2322a06b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fafaf8; --card: #ffffff; --text: #1c1c1a; --muted: #74746e; --faint: #a6a69f; --line: #e7e7e2;
  --hover: #f1f1ed; --chip: #f2f2ee; --done: #3a3a37;
  --accent: #3b5bdb; --accent-soft: rgba(59, 91, 219, .10);
  --live: #1f9d63; --live-soft: rgba(31, 157, 99, .16);
  --review: #9a5b00; --review-mark: #c27803; --review-soft: #f8edd8;
  --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 6px 24px rgba(20, 20, 15, .06);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #2c2c2a;
    --hover: #222220; --chip: #232321; --done: #d8d8d2; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .14);
    --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .18); --review: #e7b555; --review-mark: #e7b555; --review-soft: rgba(231, 181, 85, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #2c2c2a;
  --hover: #222220; --chip: #232321; --done: #d8d8d2; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .14);
  --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .18); --review: #e7b555; --review-mark: #e7b555; --review-soft: rgba(231, 181, 85, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
main { max-width: 680px; margin: 0 auto; padding: max(56px, env(safe-area-inset-top)) 24px 56px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main svg { width: 16px; height: 16px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes ring { 0% { transform: scale(.4); opacity: .55; } 80%, 100% { transform: scale(1.3); opacity: 0; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--live-soft); } 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes breathe { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- header ---------- */
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 20px; flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; }
.live .dot { background: var(--live); }
.live .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--live); opacity: 0; animation: ring 2.4s ease-out infinite; }
.live .state { color: var(--text); }
.sep { color: var(--faint); }
.paused .dot { background: var(--review-mark); }
.paused .state { color: var(--text); }
.pausing .dot { background: var(--review-mark); animation: breathe 1.6s ease-in-out infinite; }
.pausebtn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px; background: var(--chip); color: var(--text); font-size: 13px; font-weight: 550; }
.pausebtn:hover { background: var(--hover); }
.pausebtn svg { width: 11px; height: 11px; }
.pausebtn.resume { background: var(--accent); color: #fff; }
.pausebtn.resume:hover { background: var(--accent); filter: brightness(1.08); }
:root[data-theme="dark"] .pausebtn.resume { color: #10131f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pausebtn.resume { color: #10131f; } }
.parent { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.parent:hover { color: var(--text); }
.parent svg { width: 12px; height: 12px; }
h1 { margin: 12px 0 0; font-size: 30px; line-height: 1.2; font-weight: 640; letter-spacing: -0.022em; text-wrap: balance; }

.vtools { display: flex; align-items: center; gap: 8px; margin-top: 22px; font-size: 13px; color: var(--muted); min-height: 30px; flex-wrap: wrap; }
.vtools .summary { margin-right: auto; font-variant-numeric: tabular-nums; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: var(--chip); color: var(--muted); font-size: 13px; }
.pillbtn:hover { color: var(--text); background: var(--hover); }
.pillbtn svg { width: 12px; height: 12px; }
.pillbtn.review { color: var(--review); background: var(--review-soft); font-weight: 550; }

/* ---------- the map: one rail, one row per step ---------- */
.vmap { list-style: none; margin: 18px 0 0; padding: 0; }
.vrow { position: relative; display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; padding-bottom: 4px; }
.vrow::before { content: ""; position: absolute; left: 17px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.vrow.done::before { background: var(--done); opacity: .8; }
.vrow.now::before { background: linear-gradient(var(--done) 0 18px, var(--line) 18px); }
.vrow:first-child::before { top: 18px; }
.vrow.add::before { bottom: auto; height: 18px; }
.vrow:only-child::before { display: none; }
.vdot { grid-column: 1; justify-self: center; position: relative; z-index: 1; display: grid; place-items: center; border-radius: 50%; transition: transform .15s; }
.vdot:hover { transform: scale(1.12); }
.vdot.done { width: 24px; height: 24px; margin-top: 6px; background: var(--done); color: var(--bg); }
.vdot.done svg { width: 12px; height: 12px; }
.vdot.now { width: 34px; height: 34px; margin-top: 1px; background: var(--faint); }
.vdot.now.live { background: var(--live); animation: pulse 2s infinite; }
.vdot.now::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); }
.vdot.next { width: 20px; height: 20px; margin-top: 8px; border: 2px solid var(--faint); background: var(--bg); }
.vdot.next.edited { border-color: var(--accent); background: var(--accent-soft); }
.vdot.add, .vdot.more { width: 20px; height: 20px; margin-top: 8px; border: 1.5px dashed var(--faint); color: var(--faint); background: var(--bg); }
.vdot.more { border-style: solid; border-color: var(--done); background: var(--done); color: var(--bg); font-size: 10px; font-weight: 700; }
.vdot.add svg { width: 10px; height: 10px; }
.vrow.open > .vdot { outline: 2px solid var(--accent); outline-offset: 4px; }
.vbody { min-width: 0; }
.vhead { display: flex; align-items: center; gap: 8px; min-height: 36px; width: 100%; text-align: left; cursor: pointer; border-radius: 8px; }
.vtext { min-width: 0; overflow-wrap: anywhere; }
.vrow.done .vtext { color: var(--muted); }
.vrow.now .vtext { font-weight: 650; font-size: 18px; letter-spacing: -0.01em; line-height: 1.35; }
.vrow.add .vtext, .vrow.more .vtext { color: var(--muted); font-size: 15px; }
.edited-mark { color: var(--accent); font-size: 12.5px; margin-left: 8px; white-space: nowrap; }
.vmark { width: 9px; height: 9px; flex: none; transform: rotate(45deg); border-radius: 2px; background: var(--faint); }
.vmark.review { background: var(--review-mark); box-shadow: 0 0 0 3px var(--review-soft); }
.vend { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.vtime { color: var(--live); font-size: 13px; font-weight: 600; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.vtime.dim { color: var(--faint); font-weight: 500; }
.vtime.held, .kicker.now.held { color: var(--review); }
.icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--faint); touch-action: none; }
.icon:hover { color: var(--text); background: var(--hover); }
.handle { cursor: grab; }
@media (hover: hover) {
  .vrow .rowtools { opacity: 0; transition: opacity .15s; }
  .vrow:hover > .vbody > .vhead .rowtools, .vrow:focus-within > .vbody > .vhead .rowtools { opacity: 1; }
}
@media (hover: none) { .rowtools { display: none; } }
.dragging { z-index: 3; }
.dragging > .vbody > .vhead { background: var(--card); box-shadow: var(--shadow); padding: 0 10px; margin: 0 -10px; width: calc(100% + 20px); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }

/* the card a step opens into */
.vcard { margin: 4px 0 12px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; cursor: default; }
.kicker { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.kicker.now { color: var(--live); }
.kicker .t { text-transform: none; letter-spacing: 0; font-weight: 500; }
.activity { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { padding: 6px 12px; border-radius: 9px; background: var(--chip); font-size: 14px; color: var(--text); }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.fu-btn { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
input.edit, textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
input.edit:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.edit::placeholder, textarea::placeholder { color: var(--faint); }
.vhead input.edit { margin: 2px 0; }

/* decisions, inside the step they were made in */
.decisions { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
.decision { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 10px; padding: 10px 0 0; margin-top: 10px; border-top: 1px solid var(--line); font-size: 15px; }
.decisions .decision:first-child { margin-top: 0; }
.decision.nested { margin-left: 28px; border-top: 0; }
.meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; flex: none; margin-top: 4px; }
.meter i { width: 3px; border-radius: 2px; background: var(--line); }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 9px; } .meter i:nth-child(3) { height: 13px; }
.meter.c3 i, .meter.c2 i:nth-child(-n+2) { background: var(--muted); }
.meter.c1 i:nth-child(1) { background: var(--review-mark); }
.d-body { min-width: 0; }
.d-text { font-weight: 550; }
.d-reason { color: var(--muted); font-size: 14px; margin-top: 1px; }
.tag { font-size: 11.5px; font-weight: 600; line-height: 1; padding: 3px 7px; border-radius: 99px; color: var(--review); background: var(--review-soft); margin-left: 6px; position: relative; top: -1px; }
.link { color: var(--accent); font-size: 14px; padding: 2px 0; }
.link.quiet { color: var(--muted); }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.d-actions { align-self: start; }
.overridden .d-text, .overridden .d-reason { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }
.overridden .meter i { background: var(--line) !important; }
.you { margin-top: 8px; padding: 9px 12px; border-radius: 11px; background: var(--accent-soft); }
.you-text b { font-weight: 650; color: var(--accent); margin-right: 6px; }
.status { margin-top: 4px; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status.received { color: var(--accent); }
.status svg { width: 13px; height: 13px; color: var(--live); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: breathe 1.6s ease-in-out infinite; flex: none; }
form.override { margin-top: 10px; }
textarea { resize: none; min-height: 72px; line-height: 1.45; display: block; }
.form-row { display: flex; gap: 16px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.primary { background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 99px; font-size: 14px; font-weight: 550; }
.primary:disabled { opacity: .35; cursor: default; }
.hint { font-size: 12.5px; color: var(--faint); margin-right: auto; }

/* branches: your follow-ups and linked sessions */
.brt { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px 0 6px; border-radius: 7px; color: var(--faint); }
.brt:hover { background: var(--chip); color: var(--muted); }
.brt svg { width: 11px; height: 11px; transition: transform .15s; }
.brt[aria-expanded="true"] svg { transform: rotate(90deg); }
.brt .shapes { display: inline-flex; gap: 3px; align-items: center; }
.brt .shapes i { width: 8px; height: 8px; border: 1.5px solid var(--accent); border-radius: 3px; }
.brt .shapes i.s { border-color: var(--text); border-radius: 50%; }
.brt .shapes i.w { background: var(--accent); animation: breathe 1.4s ease-in-out infinite; }
.brt .n { font-size: 12px; font-weight: 600; color: var(--muted); }
.brt[aria-expanded="true"] .shapes, .brt[aria-expanded="true"] .n { display: none; }
.fus { list-style: none; margin: 0 0 10px; padding: 0 0 0 18px; display: grid; gap: 2px; }
.fu { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 15px; }
.fu::before { content: ""; position: absolute; left: -49px; top: -8px; width: 44px; height: 24px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); border-bottom-left-radius: 12px; opacity: .55; }
.fu-node { width: 14px; height: 14px; flex: none; border-radius: 5px; border: 2px solid var(--accent); background: var(--bg); display: grid; place-items: center; position: relative; z-index: 1; }
.fu-node svg { width: 8px !important; height: 8px !important; }
.fu.received .fu-node { background: linear-gradient(to top, var(--accent) 50%, var(--bg) 50%); }
.fu.done .fu-node { background: var(--accent); color: var(--bg); }
.fu-text { min-width: 0; overflow-wrap: anywhere; }
.fu.done .fu-text { color: var(--muted); }
.fu-state { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); white-space: nowrap; }
.fu.done .fu-state { color: var(--faint); }
.fu .x { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.fu .x:hover { color: var(--text); background: var(--hover); }
.fu .x svg { width: 12px; height: 12px; }
.fu input.edit { padding: 5px 10px; font-size: 15px; }
.br.session { cursor: pointer; }
.br.session::before { border-color: var(--muted); border-left-style: dashed; border-bottom-style: dashed; opacity: .6; }
.br.session .fu-node { border-radius: 50%; border-color: var(--text); color: var(--text); width: 16px; height: 16px; margin-left: -1px; }
.br.session .fu-text b { font-weight: 600; }
.br.session:hover .fu-text b { text-decoration: underline; text-underline-offset: 3px; }
.mini { display: inline-flex; gap: 2px; margin-left: 8px; vertical-align: middle; }
.mini i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.mini i.d { background: var(--done); } .mini i.n { background: var(--live); }
.br.session .fu-state { color: var(--muted); }
.br.session.working .fu-state { color: var(--live); }

/* ---------- earlier tasks ---------- */
section { margin-top: 48px; }
h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.earlier { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.task-toggle { display: grid; grid-template-columns: 14px 1fr auto; align-items: baseline; gap: 10px; width: 100%; min-height: 40px; padding: 8px 0; text-align: left; color: var(--muted); }
.task-toggle:hover, .task-toggle[aria-expanded="true"] { color: var(--text); }
.task-toggle svg { width: 12px; height: 12px; align-self: center; transition: transform .15s; }
.task-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.t-title { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-meta { color: var(--faint); font-size: 14px; white-space: nowrap; }
.task-body { padding: 2px 0 14px 24px; display: grid; gap: 4px; font-size: 15px; }
.task-body ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.t-step { display: flex; gap: 10px; align-items: baseline; color: var(--muted); }
.t-step svg { width: 12px; height: 12px; flex: none; color: var(--faint); transform: translateY(1px); }
.t-step.dropped { color: var(--faint); }
.t-step.dropped .t-mark { flex: none; width: 12px; text-align: center; }
.t-decision { display: grid; grid-template-columns: 18px 1fr; column-gap: 8px; margin-top: 6px; }
.t-decision .d-text { font-weight: 500; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 40px; }
footer.waiting { color: var(--text); }
footer.waiting .pulse { color: var(--accent); }
footer.received { color: var(--accent); }
footer svg { width: 14px; height: 14px; }
.waiting-page { padding-top: 18vh; }
.waiting-page p { color: var(--muted); max-width: 420px; }

@media (max-width: 560px) {
  main { padding: max(36px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 24px; }
  .vrow.now .vtext { font-size: 17px; }
  .vcard { padding: 14px 15px; }
  .fu { display: grid; grid-template-columns: 14px 1fr auto; column-gap: 10px; align-items: start; padding: 4px 0; }
  .fu-node { margin-top: 4px; }
  .fu-text { grid-column: 2; }
  .fu-state { grid-column: 2; margin-left: 0; }
  .fu .x { grid-column: 3; grid-row: 1; }
  .fu::before { top: -6px; height: 21px; }
  .br.session .fu-node { margin-top: 3px; }
  .task-toggle { grid-template-columns: 14px 1fr; row-gap: 2px; }
  .task-toggle svg { align-self: start; margin-top: 6px; }
  .t-title { white-space: normal; }
  .t-meta { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<main id="app" aria-live="polite"></main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('t') || '';
  const theme = params.get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  let sessionId = location.hash.slice(1);
  let state = null;
  let connected = false;
  // UI state that must survive live updates. `open` is the step whose card is open ('auto' follows the current step).
  const freshUi = () => ({ open: 'auto', editingStep: null, adding: false, dragging: false, overrideOpen: null, overrideDraft: '',
    fuAdding: null, branchOpen: new Map(), showAllDone: false, openTask: null });
  let ui = freshUi();

  const app = document.getElementById('app');
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid.nodeType ? kid : String(kid));
    return el;
  };
  const svg = (d, width = 1.6) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', String(width)); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = d;
    return s;
  };
  const dots = [4, 8, 12].flatMap(y => [6, 10].map(x => `<circle cx="${x}" cy="${y}" r=".9" fill="currentColor" stroke="none"/>`)).join('');
  const ICON = {
    grip: () => svg(dots),
    x: () => svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'),
    pause: () => svg('<path d="M5.5 3.5v9M10.5 3.5v9"/>', 2.6),
    play: () => svg('<path d="M5 3.2l8 4.8-8 4.8z" fill="currentColor"/>', 1.2),

    const list = [];
    const place = (d, depth) => { list.push([d, depth]); for (const r of decs) if (r.supersedes === d.id) place(r, depth + 1); };
    for (const d of decs) if (!d.supersedes || !decs.some(x => x.id === d.supersedes)) place(d, 0);
    const review = unresolved(state.decisions || []);
    return h('ul', { class: 'decisions' }, list.map(([d, depth]) => decision(d, depth, review.includes(d))));
  }
  // Decisions with no step at all (from before steps were tracked) still need a home.
  function otherDecisions() {
    const m = rowsModel();
    if (m.anchor) return null;
    const all = state.decisions || [];
    if (!all.length) return null;
    return h('section', { 'aria-label': 'Decisions' }, h('h2', {}, 'Decisions'), decisionList(all));
  }

  function decision(d, depth, review) {
    const o = d.override;
    const open = ui.overrideOpen === d.id;
    const canChange = (!o || o.state === 'waiting') && state.status !== 'ended';
    const level = { high: 3, medium: 2, low: 1 }[d.confidence] || 2;
    return h('li', { class: 'decision' + (o ? ' overridden' : '') + (depth ? ' nested' : '') },
      h('span', { class: `meter c${level}`, title: `${d.confidence} confidence`, role: 'img', 'aria-label': `${d.confidence} confidence` }, h('i'), h('i'), h('i')),
      h('div', { class: 'd-body' },
        h('div', {}, h('span', { class: 'd-text' }, d.text), review && h('span', { class: 'tag', title: 'The agent was unsure about this one' }, 'review')),
        d.reason && h('div', { class: 'd-reason' }, d.reason),
        o && !open && h('div', { class: 'you' }, h('div', { class: 'you-text' }, h('b', {}, 'You'), o.text), overrideStatus(d)),
        open && overrideForm(d)),
      h('span', { class: 'd-actions' },
        !open && canChange && h('button', { class: 'link', 'aria-label': `${o ? 'Edit' : 'Change'}: ${d.text}`, onclick: () => openOverride(d) }, o ? 'Edit' : 'Change')));
  }
  function overrideStatus(d) {
    const o = d.override;
    if (o.state === 'waiting') return h('div', { class: 'status' }, h('span', { class: 'pulse' }), 'Waiting for the agent’s next step',
      h('button', { class: 'link quiet', onclick: () => post('/api/user/override', { id: d.id, text: '' }) }, 'Undo'));
    if (o.state === 'received') return h('div', { class: 'status received' }, h('span', { class: 'pulse' }), 'Agent is re-planning');
    return h('div', { class: 'status' }, ICON.check(), 'Agent changed course');
  }
  function openOverride(d) {
    ui.overrideOpen = d.id;
    ui.overrideDraft = d.override ? d.override.text : '';
    paint();
    const ta = app.querySelector('form.override textarea');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function closeOverride() { ui.overrideOpen = null; ui.overrideDraft = ''; paint(); }
  function overrideForm(d) {
    const ta = h('textarea', {
      rows: 2, placeholder: 'Tell the agent what to do instead', 'aria-label': `Override: ${d.text}`,
      oninput: e => { ui.overrideDraft = e.target.value; send.disabled = !e.target.value.trim(); },
      onkeydown: e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
        if (e.key === 'Escape') closeOverride();
      },
    });
    ta.value = ui.overrideDraft;
    const send = h('button', { class: 'primary', type: 'submit', disabled: !ui.overrideDraft.trim() }, 'Send');
    const submit = async () => {
      const text = ui.overrideDraft.trim();
      if (!text) return;
      ui.overrideOpen = null; ui.overrideDraft = '';
      paint();
      await post('/api/user/override', { id: d.id, text });
    };
    return h('form', { class: 'override', onsubmit: e => { e.preventDefault(); submit(); } },
      ta,
      h('div', { class: 'form-row' },
        h('span', { class: 'hint' }, navigator.platform.includes('Mac') ? '⌘↵ to send' : 'Ctrl+Enter to send'),
        h('button', { class: 'link quiet', type: 'button', onclick: closeOverride }, 'Cancel'),
        send));
  }

  // ----- earlier tasks in this session, folded away -----
  function earlierSection() {
    const tasks = state.earlier || [];
    if (!tasks.length) return null;
    return h('section', { 'aria-label': 'Earlier tasks' },
      h('h2', {}, 'Earlier'),
      h('ul', { class: 'earlier' }, tasks.map(t => {
        const open = ui.openTask === t.id;
        const meta = [t.done.length && `${t.done.length} done`, t.dropped.length && `${t.dropped.length} not done`,
          t.decisions.length && plural(t.decisions.length, 'decision'), ago(t.endedAt) + (ago(t.endedAt) === 'just now' ? '' : ' ago')].filter(Boolean).join(' · ');
        return h('li', {},
          h('button', { class: 'task-toggle', 'aria-expanded': String(open), onclick: () => { ui.openTask = open ? null : t.id; paint(); } },
            ICON.chevron(), h('span', { class: 't-title' }, t.title || 'Untitled task'), h('span', { class: 't-meta' }, meta)),
          open && h('div', { class: 'task-body' },
            (t.done.length || t.dropped.length) ? h('ul', {},
              t.done.map(d => h('li', { class: 't-step' }, ICON.check(), d.text)),
              t.dropped.map(text => h('li', { class: 't-step dropped' }, h('span', { class: 't-mark' }, '–'), text, h('span', { class: 'sr' }, ' (not done)')))) : null,
            t.decisions.length ? h('ul', {}, t.decisions.map(d => {
              const level = { high: 3, medium: 2, low: 1 }[d.confidence] || 2;
              return h('li', { class: 't-decision' },
                h('span', { class: `meter c${level}`, role: 'img', 'aria-label': `${d.confidence} confidence` }, h('i'), h('i'), h('i')),
                h('div', {}, h('div', { class: 'd-text' }, d.text), d.override ? h('div', { class: 'd-reason' }, `You: ${d.override.text}`) : d.reason && h('div', { class: 'd-reason' }, d.reason)));
            })) : null));
      })));
  }

  function footer() {
    const e = state.edits || {};
    if (state.status === 'ended') return h('footer', {}, 'This session has ended. Edits won’t reach it.');
    if (state.pause) return h('footer', e.state === 'waiting' ? { class: 'waiting' } : {}, e.state === 'waiting' ? 'Paused. Your edit reaches the agent when you resume.' : 'Paused. Edits reach the agent when you resume.');
    if (e.state === 'waiting') return h('footer', { class: 'waiting' }, h('span', { class: 'pulse' }), 'Your edit reaches the agent at its next step.');
    if (e.state === 'received') return h('footer', { class: 'received' }, ICON.check(), 'The agent has your edit.');
    return h('footer', {}, 'Edits reach the agent at its next step.');
  }

  // keep the time counters honest without re-rendering
  setInterval(() => {
    for (const el of app.querySelectorAll('.since')) {
      const t = since(Number(el.dataset.at));
      el.textContent = el.classList.contains('t') ? '· ' + t : t;
    }
  }, 5000);

  paint();
  connect();
})();
</script>
</body>
</html>
