<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2322a06b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --text: #1c1c1a;
  --muted: #74746e;
  --faint: #a6a69f;
  --line: #e7e7e2;
  --hover: #f1f1ed;
  --chip: #f2f2ee;
  --accent: #3b5bdb;
  --accent-soft: rgba(59, 91, 219, .09);
  --live: #1f9d63;
  --live-soft: rgba(31, 157, 99, .12);
  --review: #9a5b00;
  --review-soft: #f8edd8;
  --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 6px 24px rgba(20, 20, 15, .05);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #282826;
    --hover: #1f1f1d; --chip: #232321; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .12);
    --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .13); --review: #e7b555; --review-soft: rgba(231, 181, 85, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --card: #1b1b1a; --text: #ecece7; --muted: #9b9b94; --faint: #64645e; --line: #282826;
  --hover: #1f1f1d; --chip: #232321; --accent: #8fa2ff; --accent-soft: rgba(143, 162, 255, .12);
  --live: #3ccf8e; --live-soft: rgba(60, 207, 142, .13); --review: #e7b555; --review-soft: rgba(231, 181, 85, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
main { max-width: 640px; margin: 0 auto; padding: max(64px, env(safe-area-inset-top)) 24px 56px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main svg { width: 16px; height: 16px; flex: none; }

/* ---------- header ---------- */
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }
.meta .count { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; }
.live .dot { background: var(--live); }
.live .dot::after, .node.now.live::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--live);
  opacity: 0; animation: ring 2.4s ease-out infinite;
}
@keyframes ring { 0% { transform: scale(.4); opacity: .55; } 80%, 100% { transform: scale(1.3); opacity: 0; } }
.live .state { color: var(--text); }
.sep { color: var(--faint); }
h1 { margin: 14px 0 0; font-size: 30px; line-height: 1.2; font-weight: 640; letter-spacing: -0.022em; text-wrap: balance; }

.progress { display: flex; gap: 4px; margin-top: 22px; height: 4px; }
.progress span { flex: 1; border-radius: 99px; background: var(--line); }
.progress .p-done { background: var(--text); opacity: .75; }
.progress .p-now { background: var(--live); animation: breathe 1.8s ease-in-out infinite; }
.progress.idle .p-now { background: var(--faint); animation: none; }

section { margin-top: 48px; }
h2 {
  margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.empty { color: var(--faint); margin: 0; font-size: 15px; }

/* ---------- the track: done, now, next ---------- */
.track { list-style: none; margin: 0; padding: 0; position: relative; }
.track > li { position: relative; padding-left: 34px; }
/* the rail */
.track > li::before {
  content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line);
}
.track > li:first-child::before { top: 18px; }
.track > li:last-child::before { bottom: calc(100% - 18px); }
.track > li:only-child::before { display: none; }
.node {
  position: absolute; left: 0; top: 10px; width: 16px; height: 16px; border-radius: 50%;
  display: grid; place-items: center; background: var(--bg);
}
.node::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--faint); background: var(--bg); box-sizing: border-box; }
.node.done::before { border: 0; background: var(--muted); width: 16px; height: 16px; }
.node.done svg { position: absolute; width: 10px; height: 10px; color: var(--bg); }
.node.now::before { width: 12px; height: 12px; border: 0; background: var(--faint); }
.node.now.live::before { background: var(--live); box-shadow: 0 0 0 4px var(--live-soft); }
.node.now.live::after { inset: 0; }
.node.edited::before { border-color: var(--accent); background: var(--accent); }
.node.add::before { display: none; }
.node.add svg { width: 12px; height: 12px; color: var(--faint); }

.done-toggle { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; color: var(--muted); }
.done-toggle:hover { color: var(--text); }
.done-toggle svg { width: 12px; height: 12px; transition: transform .15s; }
.done-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.done-item { min-height: 36px; padding: 7px 0; color: var(--faint); font-size: 15px; text-decoration: line-through; text-decoration-color: var(--line); }
.done-item .node { top: 10px; }

.now-row { padding-top: 4px; padding-bottom: 18px; }
.now-row .node { top: 22px; }
.now-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 17px; box-shadow: var(--shadow);
}
.now-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.now-head.live { color: var(--live); }
.now-head .since { margin-left: auto; font-weight: 450; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.now-text { margin: 8px 0 0; font-size: 19px; line-height: 1.4; font-weight: 550; letter-spacing: -0.01em; }
.now-text.quiet { color: var(--muted); font-weight: 450; }
.now-activity { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.now-sub { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13.5px; }
.chip {
  font-family: var(--mono); font-size: 12.5px; background: var(--chip); color: var(--muted); padding: 3px 8px; border-radius: 7px;
  overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px;
}
.chip svg { width: 12px; height: 12px; }

.next-label { padding: 6px 0 6px; }
.next-label h2 { margin: 0; }
.next-label::before { top: 0 !important; bottom: 0 !important; }
.step { display: flex; align-items: flex-start; gap: 6px; padding: 7px 0; min-height: 38px; }
.step .node { top: 10px; }
.step-text { flex: 1; min-width: 0; cursor: text; overflow-wrap: anywhere; border-radius: 6px; }
.edited-mark { color: var(--accent); font-size: 12.5px; margin-left: 8px; white-space: nowrap; }
.tools { display: flex; gap: 2px; flex: none; margin-top: -3px; }
.icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--faint); touch-action: none; }
.icon:hover { color: var(--text); background: var(--hover); }
.handle { cursor: grab; }
.dragging { z-index: 3; }
.dragging .step-text { background: var(--card); box-shadow: var(--shadow); border-radius: 10px; padding: 6px 10px; margin: -6px -10px; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
.step input.edit { padding: 4px 8px; margin: -5px 0 -5px -9px; width: calc(100% + 9px); border-radius: 8px; }
.add-row { padding: 6px 0; }
.add-row .node { top: 9px; }
.add { color: var(--muted); font-size: 15px; min-height: 26px; }
.add:hover { color: var(--text); }

/* ---------- decisions ---------- */
.count-chip {
  font-size: 11.5px; font-weight: 550; letter-spacing: .01em; text-transform: none; line-height: 1;
  padding: 4px 8px; border-radius: 99px; color: var(--review); background: var(--review-soft);
}
.decisions { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.decision { display: grid; grid-template-columns: 26px 1fr auto; column-gap: 8px; padding: 10px 0; border-radius: 12px; }
.decision.nested { margin-left: 34px; }
.meter { display: flex; align-items: flex-end; gap: 2px; height: 14px; margin-top: 4px; }
.meter i { width: 3px; border-radius: 2px; background: var(--line); }
.meter i:nth-child(1) { height: 6px; } .meter i:nth-child(2) { height: 10px; } .meter i:nth-child(3) { height: 14px; }
.meter.c3 i, .meter.c2 i:nth-child(-n+2) { background: var(--muted); }
.meter.c1 i:nth-child(1) { background: var(--review); }
.d-body { min-width: 0; }
.d-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.d-text { font-weight: 550; letter-spacing: -0.005em; }
.d-reason { color: var(--muted); margin-top: 2px; font-size: 15px; }
.tag {
  font-size: 11.5px; font-weight: 550; line-height: 1; padding: 4px 7px; border-radius: 99px;
  color: var(--review); background: var(--review-soft); letter-spacing: .01em; position: relative; top: -1px;
}
.link { color: var(--muted); font-size: 14px; padding: 2px 0; }
.link:hover { color: var(--text); }
.d-actions { align-self: start; padding-top: 1px; }
.d-actions .pen { display: none; width: 15px; height: 15px; }
@media (hover: hover) {
  .decision .d-actions .link, .step .tools { opacity: 0; transition: opacity .15s; }
  .decision:hover .d-actions .link, .decision:focus-within .d-actions .link,
  .step:hover .tools, .step:focus-within .tools { opacity: 1; }
}
.overridden .d-text, .overridden .d-reason { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); text-decoration-thickness: 1px; }
.overridden .meter i { background: var(--line) !important; }
.you { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
.you-text { font-weight: 500; }
.you-text b { font-weight: 650; color: var(--accent); margin-right: 6px; }
.status { margin-top: 4px; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status.received { color: var(--accent); }
.status svg { width: 13px; height: 13px; color: var(--live); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: breathe 1.6s ease-in-out infinite; flex: none; }
@keyframes breathe { 50% { opacity: .3; } }

form.override { margin-top: 12px; }
textarea, input.edit {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { resize: none; min-height: 72px; line-height: 1.45; display: block; }
textarea:focus, input.edit:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea::placeholder, input.edit::placeholder { color: var(--faint); }
.form-row { display: flex; gap: 16px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.primary { background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 99px; font-size: 14px; font-weight: 550; }
.primary:disabled { opacity: .35; cursor: default; }
.hint { font-size: 12.5px; color: var(--faint); margin-right: auto; }

footer {
  margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line);
  font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 40px;
}
footer.waiting { color: var(--text); }
footer.waiting .pulse { color: var(--accent); }
footer.received { color: var(--accent); }
footer svg { width: 14px; height: 14px; }

.waiting-page { padding-top: 18vh; }
.waiting-page p { color: var(--muted); max-width: 420px; }

@media (max-width: 520px) {
  main { padding: max(40px, env(safe-area-inset-top)) 20px 40px; }
  h1 { font-size: 25px; }
  section { margin-top: 40px; }
  .now-text { font-size: 18px; }
  .now-card { padding: 14px 16px 15px; }
  .decision.nested { margin-left: 20px; }
  .decision { grid-template-columns: 22px 1fr 30px; }
  .decision .d-actions .link { opacity: 1 !important; width: 30px; height: 30px; margin: -6px -6px 0 0; display: grid; place-items: center; color: var(--faint); }
  .d-actions .label { display: none; }
  .d-actions .pen { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('t') || '';
  const theme = params.get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  let sessionId = location.hash.slice(1);
  let state = null;
  let connected = false;
  // UI state that must survive live updates
  const ui = { overrideOpen: null, overrideDraft: '', editingStep: null, adding: false, dragging: false, showDone: false };

  const app = document.getElementById('app');
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid.nodeType ? kid : String(kid));
    return el;
  };
  const svg = d => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '1.6'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = d;
    return s;
  };
  const dots = [4, 8, 12].flatMap(y => [6, 10].map(x => `<circle cx="${x}" cy="${y}" r=".9" fill="currentColor" stroke="none"/>`)).join('');
  const ICON = {
    grip: () => svg(dots),
    x: () => svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'),
    plus: () => svg('<path d="M8 3.5v9M3.5 8h9"/>'),
    check: () => svg('<path d="M3.5 8.5l3 3 6-7"/>'),
    boldCheck: () => { const s = svg('<path d="M3.5 8.5l3 3 6-7"/>'); s.setAttribute('stroke-width', '2.4'); return s; },
    chevron: () => svg('<path d="M6 3.5l4.5 4.5L6 12.5"/>'),
    pen: () => { const s = svg('<path d="M10.5 3.5l2 2L6 12H4v-2z"/>'); s.setAttribute('class', 'pen'); return s; },
    file: () => svg('<path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/>'),
  };

  const ago = t => {
    if (!t) return '';
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m`;
    return `${Math.floor(m / 60)}h ${m % 60}m`;
  };

  // Is the agent's "now" line about the first step of its plan? Then that step is the current one.
  const STOP = new Set('a an and the to of for in on with from into by it its this that is are be as at or no not each per'.split(' '));
  const words = t => new Set(String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w => w && !STOP.has(w))
    .map(w => w.replace(/(ing|ed|es|s)$/, '')).filter(w => w.length > 1));
  function sameStep(a, b) {
    const A = words(a), B = words(b);
    if (!A.size || !B.size) return false;
    let n = 0; for (const w of A) if (B.has(w)) n++;
    return n / Math.min(A.size, B.size) >= 0.75;
  }

  // Split the plan into the step in progress (the first one, by contract) and what's queued.
  function plan() {
    const next = state.next || [];
    const working = state.status === 'working';
    const current = working && next.length ? next[0] : null;
    return { current, upcoming: current ? next.slice(1) : next, done: state.done || [], working };
  }

  // ---------- network ----------
  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN },
      body: JSON.stringify({ session: state.id, ...body }),
    });
    if (!res.ok) throw new Error(await res.text());
    const next = await res.json();
    if (next && next.id === state.id) { state = next; render(); }
  }

  let es;
  function connect() {
    es && es.close();
    es = new EventSource(`/api/events?t=${encodeURIComponent(TOKEN)}&s=${encodeURIComponent(sessionId || '*')}`);
    es.addEventListener('open', () => { connected = true; render(); });
    es.addEventListener('state', e => {
      const next = JSON.parse(e.data);
      if (next && !sessionId) { sessionId = next.id; history.replaceState(null, '', '#' + sessionId); connect(); }
      state = next;
      connected = true;
      render();
    });
    es.addEventListener('error', () => { connected = false; render(); });
  }
  window.addEventListener('hashchange', () => { sessionId = location.hash.slice(1); connect(); });

  // ---------- render ----------
  const busy = () => ui.overrideOpen || ui.editingStep || ui.adding || ui.dragging;
  // Live updates call render(); the user's own actions call paint().
  function render() {
    // Don't rebuild under the user's cursor; catch up when they finish.
    if (busy()) { const meta = app.querySelector('.meta'); if (meta && state) meta.replaceWith(header()); return; }
    paint();
  }
  function paint() {
    const started = state && (state.title || state.now?.text || state.decisions?.length || state.next?.length || state.done?.length);
    app.replaceChildren(...(started ? page() : waiting()));
    document.title = state && state.title ? `${state.title} · ${statusLabel()}` : 'Status';
  }

  function statusLabel() {
    if (!connected) return 'Reconnecting';
    if (!state) return 'Waiting';
    if (state.status === 'working') return 'Live';
    if (state.status === 'ended') return 'Session ended';
    return 'Idle';
  }

  function waiting() {
    return [h('div', { class: 'waiting-page' },
      h('div', { class: 'meta' }, h('span', { class: 'dot' }), h('span', {}, connected ? 'Connected' : 'Connecting…')),
      h('h1', {}, 'Waiting for Claude'),
      h('p', {}, 'Start a multi-step task in Claude Code. This page fills in as it works.'))];
  }

  function header() {
    const live = connected && state.status === 'working';
    const project = (state.cwd || '').split('/').filter(Boolean).pop();
    const { current, upcoming, done } = plan();
    const total = done.length + (current ? 1 : 0) + upcoming.length;
    const count = total ? (current ? `Step ${done.length + 1} of ${total}` : `${done.length} of ${total} done`) : '';
    return h('div', { class: 'meta' + (live ? ' live' : '') },
      h('span', { class: 'dot' }), h('span', { class: 'state' }, statusLabel()),
      project && h('span', { class: 'sep' }, '·'), project && h('span', {}, project),
      count && h('span', { class: 'count' }, count));
  }

  function progress() {
    const { current, upcoming, done, working } = plan();
    const total = done.length + (current ? 1 : 0) + upcoming.length;
    if (!total) return null;
    if (total > 24) {
      const pct = Math.round(100 * done.length / total);
      return h('div', { class: 'progress', role: 'img', 'aria-label': `${done.length} of ${total} steps done` },
        h('span', { class: 'p-done', style: `flex:${pct}` }), h('span', { style: `flex:${100 - pct}` }));
    }
    return h('div', { class: 'progress' + (working ? '' : ' idle'), role: 'img', 'aria-label': `${done.length} of ${total} steps done` },
      done.map(() => h('span', { class: 'p-done' })),
      current && h('span', { class: 'p-now' }),
      upcoming.map(() => h('span', {})));
  }

  function page() {
    return [header(), h('h1', {}, state.title || 'Untitled task'), progress(), trackSection(), decisionsSection(), footer()];
  }

  // ----- now + next up, as one track -----
  function trackSection() {
    const { current, upcoming, done } = plan();
    const items = [];
    if (done.length) {
      items.push(h('li', {},
        h('span', { class: 'node done' }, ICON.boldCheck()),
        h('button', { class: 'done-toggle', 'aria-expanded': String(ui.showDone), onclick: () => { ui.showDone = !ui.showDone; paint(); } },
          `${done.length} done`, ICON.chevron())));
      if (ui.showDone) for (const d of done) items.push(h('li', { class: 'done-item' }, h('span', { class: 'node done' }, ICON.boldCheck()), d.text));
    }
    items.push(nowItem(current));
    items.push(h('li', { class: 'next-label' }, h('h2', {}, 'Next up')));
    upcoming.forEach(n => items.push(step(n)));
    items.push(ui.adding ? h('li', { class: 'add-row' }, h('span', { class: 'node add' }, ICON.plus()), addForm())
      : h('li', { class: 'add-row' }, h('span', { class: 'node add' }, ICON.plus()),
        h('button', { class: 'add', onclick: () => { ui.adding = true; paint(); app.querySelector('.add-row input')?.focus(); } },
          upcoming.length ? 'Add a step' : 'Nothing queued. Add a step')));
    return h('section', { 'aria-label': 'Now and next up' }, h('ol', { class: 'track' }, items));
  }

  function nowItem(current) {
    const n = state.now || {};
    const working = state.status === 'working';
    const live = working && connected;
    // Title is the plan step; the agent's live line shows under it only when it adds something.
    const same = current && n.text && sameStep(n.text, current.text);
    let text = current ? (same ? n.text : current.text) : (n.text || (working ? 'Getting started' : 'Nothing yet'));
    let activity = current && n.text && !same ? n.text : null;
    let sub = null;
    if (state.status === 'ended') text = 'Session ended';
    else if (!working && (n.text || state.done?.length)) { text = 'Waiting for you'; sub = n.text ? `Last: ${n.text}` : null; }
    return h('li', { class: 'now-row' },
      h('span', { class: 'node now' + (live ? ' live' : '') }),
      h('div', { class: 'now-card' },
        h('div', { class: 'now-head' + (live ? ' live' : '') }, 'Now',
          working && n.at ? h('span', { class: 'since', 'data-at': n.at }, ago(n.at)) : null),
        h('p', { class: 'now-text' + (working ? '' : ' quiet') }, text),
        activity ? h('p', { class: 'now-activity' }, activity) : null,
        (working && n.file) || sub ? h('div', { class: 'now-sub' },
          working && n.file ? h('span', { class: 'chip' }, ICON.file(), n.file) : null,
          sub ? h('span', {}, sub) : null) : null));
  }

  function step(n) {
    const editing = ui.editingStep === n.id;
    const li = h('li', { class: 'step', 'data-id': n.id },
      h('span', { class: 'node' + (n.edited ? ' edited' : '') }),
      editing ? stepInput(n) : h('span', {
        class: 'step-text', tabindex: 0, role: 'button', 'aria-label': `Edit step: ${n.text}`,
        onclick: () => startEdit(n), onkeydown: e => {
          if (e.key === 'Enter') { e.preventDefault(); startEdit(n); }
          if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); move(n.id, e.key === 'ArrowUp' ? -1 : 1); }
        },
      }, n.text, n.edited && h('span', { class: 'edited-mark' }, 'edited')),
      !editing && h('span', { class: 'tools' },
        h('button', { class: 'icon handle', 'aria-label': 'Drag to reorder (or Alt+Arrow keys)', title: 'Drag to reorder', onpointerdown: e => startDrag(e, li) }, ICON.grip()),
        h('button', { class: 'icon', 'aria-label': 'Remove step', title: 'Remove', onclick: () => saveUpcoming(plan().upcoming.filter(x => x.id !== n.id)) }, ICON.x())));
    return li;
  }

  function startEdit(n) {
    ui.editingStep = n.id;
    paint();
    const input = app.querySelector('.step input.edit');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  function stepInput(n) {
    let done = false;
    const finish = commit => {
      if (done) return; done = true;
      const text = input.value.trim();
      ui.editingStep = null;
      const up = plan().upcoming;
      if (commit && text && text !== n.text) saveUpcoming(up.map(x => x.id === n.id ? { ...x, text } : x));
      else if (commit && !text) saveUpcoming(up.filter(x => x.id !== n.id));
      else paint();
    };
    const input = h('input', {
      class: 'edit', value: n.text, 'aria-label': 'Step', maxlength: 200,
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } if (e.key === 'Escape') finish(false); },
      onblur: () => finish(true),
    });
    return input;
  }
  function addForm() {
    let done = false;
    const finish = commit => {
      if (done) return; done = true;
      const text = input.value.trim();
      ui.adding = false;
      if (commit && text) saveUpcoming([...plan().upcoming, { text }]).then(() => { ui.adding = true; paint(); app.querySelector('.add-row input')?.focus(); });
      else paint();
    };
    const input = h('input', {
      class: 'edit', placeholder: 'Describe a step and press Enter', 'aria-label': 'New step', maxlength: 200,
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } if (e.key === 'Escape') finish(false); },
      onblur: () => finish(!!input.value.trim()),
    });
    return h('div', { style: 'flex:1' }, input);
  }
  function move(id, delta) {
    const list = [...plan().upcoming];
    const i = list.findIndex(x => x.id === id), j = i + delta;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    saveUpcoming(list).then(() => app.querySelector(`.step[data-id="${CSS.escape(id)}"] .step-text`)?.focus());
  }
  // The step in progress stays put; the user edits what comes after it.
  function saveUpcoming(upcoming) {
    const { current } = plan();
    const next = current ? [current, ...upcoming] : upcoming;
    state = { ...state, next: next.map(x => ({ ...x })) };
    paint();
    return post('/api/user/plan', { next: next.map(({ id, text }) => ({ id, text })) }).catch(() => {});
  }

  function startDrag(e, li) {
    if (e.button !== 0) return;
    e.preventDefault();
    const list = li.parentElement;
    const rows = () => [...list.children].filter(el => el.classList.contains('step'));
    const origin = rows().map(el => el.dataset.id).join();
    const startY = e.clientY;
    let offset = 0;
    ui.dragging = true;
    li.classList.add('dragging');
    document.body.classList.add('is-dragging');
    const onMove = ev => {
      // Put the row before the first other step whose middle is below the pointer.
      const others = rows().filter(el => el !== li);
      const target = others.find(el => { const r = el.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; })
        || list.querySelector('.add-row');
      if (li.nextElementSibling !== target) {
        const before = li.offsetTop;
        list.insertBefore(li, target);
        offset += li.offsetTop - before;
      }
      li.style.transform = `translateY(${ev.clientY - startY - offset}px)`;
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      document.body.classList.remove('is-dragging');
      ui.dragging = false;
      const order = rows().map(el => el.dataset.id);
      const up = plan().upcoming;
      if (order.join() !== origin) saveUpcoming(order.map(id => up.find(x => x.id === id)).filter(Boolean));
      else paint();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  // ----- decisions -----
  function decisionsSection() {
    // A decision that replaces an overridden one goes right under it.
    const all = state.decisions || [];
    const list = [];
    const place = (d, depth) => { list.push([d, depth]); for (const r of all) if (r.supersedes === d.id) place(r, depth + 1); };
    for (const d of all) if (!d.supersedes || !all.some(x => x.id === d.supersedes)) place(d, 0);
    const toReview = all.filter(d => d.confidence === 'low' && !d.override && !all.some(r => r.supersedes === d.id)).length;
    return h('section', { 'aria-label': 'Decisions' },
      h('h2', {}, 'Decisions', toReview ? h('span', { class: 'count-chip' }, `${toReview} to review`) : null),
      list.length ? h('ul', { class: 'decisions' }, list.map(([d, depth]) => decision(d, depth))) : h('p', { class: 'empty' }, 'None yet.'));
  }

  function decision(d, depth) {
    const o = d.override;
    const open = ui.overrideOpen === d.id;
    const canChange = !o || o.state === 'waiting';
    const level = { high: 3, medium: 2, low: 1 }[d.confidence] || 2;
    return h('li', { class: 'decision' + (o ? ' overridden' : '') + (depth ? ' nested' : '') },
      h('span', { class: `meter c${level}`, title: `${d.confidence} confidence`, role: 'img', 'aria-label': `${d.confidence} confidence` },
        h('i'), h('i'), h('i')),
      h('div', { class: 'd-body' },
        h('div', { class: 'd-head' },
          h('span', { class: 'd-text' }, d.text),
          !o && d.confidence === 'low' && h('span', { class: 'tag', title: 'The agent was unsure about this one' }, 'review')),
        d.reason && h('div', { class: 'd-reason' }, d.reason),
        o && !open && h('div', { class: 'you' }, h('div', { class: 'you-text' }, h('b', {}, 'You'), o.text), overrideStatus(d)),
        open && overrideForm(d)),
      h('span', { class: 'd-actions' },
        !open && canChange && h('button', { class: 'link', 'aria-label': `${o ? 'Edit' : 'Change'}: ${d.text}`, onclick: () => openOverride(d) },
          h('span', { class: 'label' }, o ? 'Edit' : 'Change'), ICON.pen())));
  }

  function overrideStatus(d) {
    const o = d.override;
    if (o.state === 'waiting') return h('div', { class: 'status' }, h('span', { class: 'pulse' }), 'Waiting for the agent’s next step',
      h('button', { class: 'link', onclick: () => post('/api/user/override', { id: d.id, text: '' }) }, 'Undo'));
    if (o.state === 'received') return h('div', { class: 'status received' }, h('span', { class: 'pulse' }), 'Agent is re-planning');
    return h('div', { class: 'status' }, ICON.check(), 'Agent changed course');
  }

  function openOverride(d) {
    ui.overrideOpen = d.id;
    ui.overrideDraft = d.override ? d.override.text : '';
    paint();
    const ta = app.querySelector('form.override textarea');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function closeOverride() { ui.overrideOpen = null; ui.overrideDraft = ''; paint(); }

  function overrideForm(d) {
    const ta = h('textarea', {
      rows: 2, placeholder: 'Tell the agent what to do instead', 'aria-label': `Override: ${d.text}`,
      oninput: e => { ui.overrideDraft = e.target.value; send.disabled = !e.target.value.trim(); },
      onkeydown: e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
        if (e.key === 'Escape') closeOverride();
      },
    });
    ta.value = ui.overrideDraft;
    const send = h('button', { class: 'primary', type: 'submit', disabled: !ui.overrideDraft.trim() }, 'Send');
    const submit = async () => {
      const text = ui.overrideDraft.trim();
      if (!text) return;
      ui.overrideOpen = null; ui.overrideDraft = '';
      paint();
      await post('/api/user/override', { id: d.id, text });
    };
    return h('form', { class: 'override', onsubmit: e => { e.preventDefault(); submit(); } },
      ta,
      h('div', { class: 'form-row' },
        h('span', { class: 'hint' }, navigator.platform.includes('Mac') ? '⌘↵ to send' : 'Ctrl+Enter to send'),
        h('button', { class: 'link', type: 'button', onclick: closeOverride }, 'Cancel'),
        send));
  }

  function footer() {
    const e = state.edits || {};
    if (state.status === 'ended') return h('footer', {}, 'This session has ended. Edits won’t reach it.');
    if (e.state === 'waiting') return h('footer', { class: 'waiting' }, h('span', { class: 'pulse' }), 'Your edit reaches the agent at its next step.');
    if (e.state === 'received') return h('footer', { class: 'received' }, ICON.check(), 'The agent has your edit.');
    return h('footer', {}, 'Edits reach the agent at its next step.');
  }

  // keep the "2m" counters honest without re-rendering
  setInterval(() => { for (const el of app.querySelectorAll('.since')) el.textContent = ago(Number(el.dataset.at)); }, 20000);

  paint();
  connect();
})();
</script>
</body>
</html>
